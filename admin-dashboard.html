<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HyPrix Support Dashboard</title>

    <link rel="icon" type="image/png" href="./HyPrix.png">
    <link rel="stylesheet" href="./style.css">

    <style>
        .dashboard-container {
            max-width: 1100px;
            margin: 50px auto;
            padding: 20px;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .dashboard-header h1 {
            margin: 0;
        }

        .dashboard-header p {
            color: #8fa3c9;
            margin-top: 6px;
        }

        .logout-button {
            border: 1px solid rgba(100, 160, 255, 0.25);
            padding: 11px 18px;
            border-radius: 10px;
            background: rgba(10, 25, 55, 0.7);
            color: white;
            cursor: pointer;
        }

        .logout-button:hover {
            background: rgba(20, 50, 100, 0.8);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
        }

        .panel {
            background: rgba(8, 20, 45, 0.78);
            border: 1px solid rgba(80, 150, 255, 0.2);
            border-radius: 20px;
            padding: 22px;
            box-shadow: 0 0 30px rgba(0, 100, 255, 0.1);
            backdrop-filter: blur(15px);
        }

        .panel h2 {
            margin-top: 0;
        }

        .conversation-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 600px;
            overflow-y: auto;
        }

        .conversation {
            padding: 15px;
            border-radius: 12px;
            background: rgba(20, 40, 75, 0.6);
            border: 1px solid transparent;
            cursor: pointer;
            transition: 0.2s;
        }

        .conversation:hover {
            border-color: rgba(80, 150, 255, 0.4);
            transform: translateY(-1px);
        }

        .conversation.active {
            border-color: #1677ff;
            box-shadow: 0 0 15px rgba(22, 119, 255, 0.15);
        }

        .conversation-name {
            font-weight: 600;
        }

        .conversation-code {
            font-size: 12px;
            color: #78adff;
            margin-top: 5px;
        }

        .conversation-status {
            font-size: 11px;
            color: #8fa3c9;
            margin-top: 6px;
        }

        .empty {
            color: #7182a5;
            font-size: 14px;
        }

        .chat {
            display: flex;
            flex-direction: column;
            min-height: 600px;
        }

        .chat-header {
            border-bottom: 1px solid rgba(100, 160, 255, 0.15);
            padding-bottom: 15px;
            margin-bottom: 15px;
        }

        .chat-header h2 {
            margin: 0;
        }

        .chat-header span {
            color: #78adff;
            font-size: 13px;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 10px 0;
        }

        .message {
            max-width: 75%;
            padding: 12px 15px;
            border-radius: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .message.customer {
            align-self: flex-start;
            background: rgba(40, 60, 100, 0.7);
        }

        .message.admin {
            align-self: flex-end;
            background: #1677ff;
        }

        .message-label {
            font-size: 11px;
            opacity: 0.7;
            margin-bottom: 4px;
        }

        .message-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 5px;
        }

        .reply-area {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .reply-input {
            flex: 1;
            resize: none;
            min-height: 50px;
            padding: 13px;
            box-sizing: border-box;
            border-radius: 12px;
            border: 1px solid rgba(100, 160, 255, 0.25);
            background: rgba(0, 10, 30, 0.7);
            color: white;
            outline: none;
            font-family: inherit;
        }

        .reply-input:focus {
            border-color: rgba(80, 150, 255, 0.8);
            box-shadow: 0 0 15px rgba(50, 120, 255, 0.15);
        }

        .reply-button {
            border: none;
            padding: 13px 20px;
            border-radius: 12px;
            background: #1677ff;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .reply-button:hover {
            box-shadow: 0 8px 25px rgba(20, 110, 255, 0.3);
        }

        .reply-button:disabled {
            opacity: 0.7;
            cursor: wait;
        }

        .close-button {
            border: 1px solid rgba(255, 100, 100, 0.3);
            padding: 10px 16px;
            border-radius: 10px;
            background: rgba(100, 20, 30, 0.3);
            color: #ff9ca5;
            cursor: pointer;
            margin-top: 10px;
        }

        .close-button:hover {
            background: rgba(120, 25, 35, 0.45);
        }

        .loading {
            color: #8fa3c9;
        }

        .dashboard-error {
            margin-bottom: 20px;
            padding: 13px 16px;
            border-radius: 12px;
            background: rgba(255, 50, 70, 0.1);
            border: 1px solid rgba(255, 50, 70, 0.2);
            color: #ff8995;
            display: none;
        }

        @media (max-width: 800px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }

            .dashboard-header {
                align-items: flex-start;
                flex-direction: column;
            }

            .message {
                max-width: 90%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <img
            src="./HyPrix.png"
            alt="HyPrix"
            height="40"
        >
    </div>

    <nav>
        <a href="./index.html">Home</a>
        <a href="./support.html">Support</a>
    </nav>
</header>


<main class="dashboard-container">

    <div
        id="dashboard-error"
        class="dashboard-error"
    ></div>


    <div class="dashboard-header">

        <div>
            <h1>Support Dashboard</h1>

            <p>
                Manage HyPrix customer conversations.
            </p>
        </div>

        <button
            class="logout-button"
            id="logout-button"
        >
            Logout
        </button>

    </div>


    <div class="dashboard-grid">

        <!-- CONVERSATIONS -->

        <div class="panel">

            <h2>Conversations</h2>

            <div
                id="conversation-list"
                class="conversation-list"
            >
                <div class="loading">
                    Loading conversations...
                </div>
            </div>

        </div>


        <!-- CHAT -->

        <div class="panel chat">

            <div
                id="chat-header"
                class="chat-header"
            >

                <h2>
                    Select a conversation
                </h2>

                <span>
                    Choose a customer from the list.
                </span>

            </div>


            <div
                id="messages"
                class="messages"
            ></div>


            <div
                id="reply-area"
                class="reply-area"
                style="display:none;"
            >

                <textarea
                    id="reply-input"
                    class="reply-input"
                    placeholder="Type your reply..."
                ></textarea>

                <button
                    id="reply-button"
                    class="reply-button"
                >
                    Send
                </button>

            </div>


            <button
                id="close-button"
                class="close-button"
                style="display:none;"
            >
                Close Conversation
            </button>

        </div>

    </div>

</main>


<script>

const WORKER_URL =
    "https://hyprix-support.blueprixsupport.workers.dev";


/* =========================
   ADMIN SESSION
========================= */

const session =
    sessionStorage.getItem(
        "hyprix-admin-session"
    );


if (!session) {

    window.location.replace(
        "./admin.html"
    );

}


/* =========================
   STATE
========================= */

let selectedConversation = null;


/* =========================
   ERROR DISPLAY
========================= */

function showError(message) {

    const box =
        document.getElementById(
            "dashboard-error"
        );

    box.textContent = message;

    box.style.display = "block";

}


/* =========================
   API
========================= */

async function api(
    path,
    options = {}
) {

    options.headers = {

        "Content-Type":
            "application/json",

        "Authorization":
            "Bearer " + session,

        ...(options.headers || {})

    };


    let response;

    try {

        response =
            await fetch(
                WORKER_URL + path,
                options
            );

    } catch (error) {

        console.error(
            "API connection error:",
            error
        );

        showError(
            "Unable to connect to the support server."
        );

        return null;

    }


    if (response.status === 401) {

        sessionStorage.removeItem(
            "hyprix-admin-session"
        );

        window.location.replace(
            "./admin.html"
        );

        return null;

    }


    let data;

    try {

        data =
            await response.json();

    } catch (error) {

        console.error(
            "Invalid server response:",
            error
        );

        showError(
            "The support server returned an invalid response."
        );

        return null;

    }


    if (!response.ok) {

        console.error(
            "API error:",
            data
        );

        showError(
            data.error ||
            "The server returned an error."
        );

    }


    return data;

}


/* =========================
   LOAD CONVERSATIONS
========================= */

async function loadConversations() {

    const list =
        document.getElementById(
            "conversation-list"
        );


    list.innerHTML =
        '<div class="loading">Loading conversations...</div>';


    const result =
        await api(
            "/admin/conversations"
        );


    if (!result) {
        return;
    }


    if (
        !result.success
    ) {

        list.innerHTML =
            '<div class="empty">Unable to load conversations.</div>';

        return;

    }


    list.innerHTML = "";


    if (
        !result.conversations ||
        result.conversations.length === 0
    ) {

        list.innerHTML =
            '<div class="empty">No conversations yet.</div>';

        return;

    }


    result.conversations.forEach(
        conversation => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "conversation";


            item.innerHTML = `

                <div class="conversation-name">
                    ${escapeHtml(
                        conversation.customer_name
                    )}
                </div>

                <div class="conversation-code">
                    ${escapeHtml(
                        conversation.support_code
                    )}
                </div>

                <div class="conversation-status">
                    ${escapeHtml(
                        conversation.status
                    )}
                </div>

            `;


            item.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".conversation"
                        )
                        .forEach(
                            el =>
                                el.classList.remove(
                                    "active"
                                )
                        );


                    item.classList.add(
                        "active"
                    );


                    openConversation(
                        conversation.id
                    );

                }
            );


            list.appendChild(
                item
            );

        }
    );

}


/* =========================
   OPEN CONVERSATION
========================= */

async function openConversation(
    id
) {

    selectedConversation =
        id;


    const result =
        await api(
            "/admin/conversation",
            {
                method: "POST",

                body: JSON.stringify({

                    id: id

                })
            }
        );


    if (!result) {
        return;
    }


    if (
        !result.success
    ) {

        showError(
            result.error ||
            "Unable to open conversation."
        );

        return;

    }


    const conversation =
        result.conversation;


    document
        .getElementById(
            "chat-header"
        )
        .innerHTML = `

            <h2>
                ${escapeHtml(
                    conversation.customer_name
                )}
            </h2>

            <span>
                ${escapeHtml(
                    conversation.support_code
                )}

                •

                ${escapeHtml(
                    conversation.status
                )}
            </span>

        `;


    const messages =
        document.getElementById(
            "messages"
        );


    messages.innerHTML = "";


    (
        result.messages ||
        []
    ).forEach(
        message => {

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "message " +
                (
                    message.sender === "admin"
                        ? "admin"
                        : "customer"
                );


            div.innerHTML = `

                <div class="message-label">
                    ${
                        message.sender === "admin"
                            ? "You"
                            : escapeHtml(
                                conversation.customer_name
                            )
                    }
                </div>

                <div>
                    ${escapeHtml(
                        message.message
                    )}
                </div>

                <div class="message-time">
                    ${new Date(
                        message.created_at
                    ).toLocaleString()}
                </div>

            `;


            messages.appendChild(
                div
            );

        }
    );


    messages.scrollTop =
        messages.scrollHeight;


    const isOpen =
        conversation.status === "open";


    document
        .getElementById(
            "reply-area"
        )
        .style.display =
            isOpen
                ? "flex"
                : "none";


    document
        .getElementById(
            "close-button"
        )
        .style.display =
            isOpen
                ? "block"
                : "none";

}


/* =========================
   SEND ADMIN REPLY
========================= */

document
    .getElementById(
        "reply-button"
    )
    .addEventListener(
        "click",
        async function () {

            if (
                !selectedConversation
            ) {
                return;
            }


            const input =
                document.getElementById(
                    "reply-input"
                );


            const message =
                input.value.trim();


            if (!message) {
                return;
            }


            this.disabled =
                true;

            this.textContent =
                "Sending...";


            const result =
                await api(
                    "/admin/reply",
                    {
                        method: "POST",

                        body:
                            JSON.stringify({

                                id:
                                    selectedConversation,

                                message:
                                    message

                            })
                    }
                );


            this.disabled =
                false;

            this.textContent =
                "Send";


            if (
                result &&
                result.success
            ) {

                input.value = "";


                await openConversation(
                    selectedConversation
                );


                await loadConversations();

            }

        }
    );


/* =========================
   CLOSE CONVERSATION
========================= */

document
    .getElementById(
        "close-button"
    )
    .addEventListener(
        "click",
        async function () {

            if (
                !selectedConversation
            ) {
                return;
            }


            const confirmed =
                confirm(
                    "Close this conversation?"
                );


            if (!confirmed) {
                return;
            }


            this.disabled =
                true;


            const result =
                await api(
                    "/admin/close",
                    {
                        method: "POST",

                        body:
                            JSON.stringify({

                                id:
                                    selectedConversation

                            })
                    }
                );


            this.disabled =
                false;


            if (
                result &&
                result.success
            ) {

                await openConversation(
                    selectedConversation
                );


                await loadConversations();

            }

        }
    );


/* =========================
   LOGOUT
========================= */

document
    .getElementById(
        "logout-button"
    )
    .addEventListener(
        "click",
        function () {

            sessionStorage.removeItem(
                "hyprix-admin-session"
            );


            window.location.replace(
                "./admin.html"
            );

        }
    );


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
    value
) {

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}


/* =========================
   START DASHBOARD
========================= */

loadConversations();

</script>

</body>
</html>
