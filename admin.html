<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HyPrix Admin</title>

    <link rel="icon" type="image/png" href="./HyPrix.png">
    <link rel="stylesheet" href="./style.css">

    <style>
        .admin-container {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .admin-box {
            width: 100%;
            max-width: 430px;
            box-sizing: border-box;
            padding: 35px;
            border-radius: 22px;
            background: rgba(8, 20, 45, 0.78);
            border: 1px solid rgba(80, 150, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 100, 255, 0.15);
            backdrop-filter: blur(15px);
        }

        .admin-box h1 {
            margin-bottom: 8px;
        }

        .admin-box p {
            color: #aab8d4;
            margin-bottom: 28px;
        }

        .admin-input {
            width: 100%;
            box-sizing: border-box;
            padding: 15px 17px;
            border-radius: 12px;
            border: 1px solid rgba(100, 160, 255, 0.25);
            background: rgba(0, 10, 30, 0.7);
            color: white;
            outline: none;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .admin-input:focus {
            border-color: rgba(80, 150, 255, 0.8);
            box-shadow: 0 0 15px rgba(50, 120, 255, 0.15);
        }

        .admin-button {
            width: 100%;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            background: #1677ff;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .admin-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(20, 110, 255, 0.3);
        }

        .admin-button:disabled {
            opacity: 0.7;
            cursor: wait;
            transform: none;
            box-shadow: none;
        }

        .admin-error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 50, 70, 0.1);
            border: 1px solid rgba(255, 50, 70, 0.2);
            color: #ff8995;
            font-size: 14px;
        }

        .admin-note {
            margin-top: 20px;
            color: #7182a5;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        <img
            src="./HyPrix.png"
            alt="HyPrix"
            height="40"
        >
    </div>

    <nav>
        <a href="./index.html">Home</a>
        <a href="./support.html">Support</a>
    </nav>
</header>

<main class="admin-container">

    <div class="admin-box">

        <h1>HyPrix Admin</h1>

        <p>
            Enter your administrator code to continue.
        </p>

        <form id="admin-form">

            <input
                id="admin-code"
                class="admin-input"
                type="password"
                placeholder="Admin code"
                autocomplete="off"
                maxlength="128"
                required
            >

            <button
                class="admin-button"
                type="submit"
            >
                Login
            </button>

        </form>

        <div
            id="admin-error"
            class="admin-error"
        ></div>

        <div class="admin-note">
            Authorized HyPrix administrators only.
        </div>

    </div>

</main>

<script>

const WORKER_URL =
    "https://hyprix-support.blueprixsupport.workers.dev";


document
    .getElementById("admin-form")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const code =
                document
                    .getElementById("admin-code")
                    .value
                    .trim();

            const error =
                document.getElementById(
                    "admin-error"
                );

            const button =
                document.querySelector(
                    ".admin-button"
                );

            error.style.display = "none";

            if (!code) {

                error.textContent =
                    "Please enter your admin code.";

                error.style.display =
                    "block";

                return;
            }

            button.disabled = true;
            button.textContent = "Checking...";

            try {

                const response =
                    await fetch(
                        WORKER_URL + "/admin/login",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                code: code
                            })
                        }
                    );

                const result =
                    await response.json();

                console.log(
                    "Admin login response:",
                    result
                );

                if (
                    response.ok &&
                    result.success &&
                    result.session
                ) {

                    sessionStorage.setItem(
                        "hyprix-admin-session",
                        result.session
                    );

                    const savedSession =
                        sessionStorage.getItem(
                            "hyprix-admin-session"
                        );

                    if (!savedSession) {

                        error.textContent =
                            "The browser could not save the admin session.";

                        error.style.display =
                            "block";

                        button.disabled = false;
                        button.textContent = "Login";

                        return;
                    }

                    window.location.href =
                        "./admin-dashboard.html";

                    return;
                }

                error.textContent =
                    result.error ||
                    "Invalid admin code.";

                error.style.display =
                    "block";

            } catch (err) {

                console.error(
                    "Admin login error:",
                    err
                );

                error.textContent =
                    "Unable to connect to the support server.";

                error.style.display =
                    "block";
            }

            button.disabled = false;
            button.textContent = "Login";
        }
    );

</script>

</body>
</html>
