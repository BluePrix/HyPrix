<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HyPrix Admin</title>

    <link
        rel="icon"
        type="image/png"
        href="./HyPrix.png"
    >

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <style>
        .admin-container {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .admin-box {
            width: 100%;
            max-width: 430px;
            box-sizing: border-box;
            padding: 35px;
            border-radius: 22px;
            background: rgba(8, 20, 45, 0.78);
            border: 1px solid rgba(80, 150, 255, 0.2);
            box-shadow: 0 0 40px rgba(0, 100, 255, 0.15);
            backdrop-filter: blur(15px);
        }

        .admin-box h1 {
            margin-bottom: 8px;
        }

        .admin-box p {
            color: #aab8d4;
            margin-bottom: 28px;
        }

        .admin-input {
            width: 100%;
            box-sizing: border-box;
            padding: 15px 17px;
            border-radius: 12px;
            border: 1px solid rgba(100, 160, 255, 0.25);
            background: rgba(0, 10, 30, 0.7);
            color: white;
            outline: none;
            font-size: 15px;
            margin-bottom: 15px;
        }

        .admin-input:focus {
            border-color: rgba(80, 150, 255, 0.8);
            box-shadow: 0 0 15px rgba(50, 120, 255, 0.15);
        }

        .admin-button {
            width: 100%;
            border: none;
            padding: 14px 20px;
            border-radius: 12px;
            background: #1677ff;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .admin-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(20, 110, 255, 0.3);
        }

        .admin-error {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: rgba(255, 50, 70, 0.1);
            border: 1px solid rgba(255, 50, 70, 0.2);
            color: #ff8995;
            font-size: 14px;
        }

        .admin-note {
            margin-top: 20px;
            color: #7182a5;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        <img
            src="./HyPrix.png"
            alt="HyPrix"
            height="40"
        >
    </div>

    <nav>
        <a href="./index.html">Home</a>
        <a href="./support.html">Support</a>
    </nav>

</header>

<main class="admin-container">

    <div class="admin-box">

        <h1>HyPrix Admin</h1>

        <p>
            Enter your administrator code to continue.
        </p>

        <form id="admin-form">

            <input
                id="admin-code"
                class="admin-input"
                type="password"
                placeholder="Admin code"
                autocomplete="off"
                maxlength="128"
                required
            >

            <button
                class="admin-button"
                type="submit"
            >
                Login
            </button>

        </form>

        <div
            id="admin-error"
            class="admin-error"
        >
            Invalid admin code.
        </div>

        <div class="admin-note">
            Authorized HyPrix administrators only.
        </div>

    </div>

</main>

<script>
    document
        .getElementById("admin-form")
        .addEventListener("submit", async function (event) {

            event.preventDefault();

            const code =
                document
                    .getElementById("admin-code")
                    .value;

            const error =
                document.getElementById("admin-error");

            error.style.display = "none";

            /*
             * IMPORTANT:
             *
             * We are NOT putting the real admin
             * code in this JavaScript.
             *
             * The login will be connected to the
             * secure Cloudflare backend next.
             */

            error.textContent =
                "The secure admin backend has not been connected yet.";

            error.style.display = "block";
        });
</script>

</body>
</html>
